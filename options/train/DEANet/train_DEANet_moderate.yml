# DEA-Net Moderate 子集单独训练配置
# 数据：datasets/OWH/Moderate/{train,test}（setup_owh.py 生成）
# PYTHONPATH="./:${PYTHONPATH}" CUDA_VISIBLE_DEVICES=0 python basicsr/train.py -opt options/train/DEANet/train_DEANet_moderate.yml

# general settings
name: 103_DEANet_OWH-Moderate_50k_B16G1
model_type: DehazeModel
scale: 1
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: OWH-Moderate
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/train/clear
    dataroot_lq: datasets/OWH/Moderate/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 6
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

# network structures
network_g:
  type: DEANet
  base_dim: 32

# path
path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 50000  # 8226 张 x bs16 ≈ 514 iter/epoch，50k ≈ 100 epoch
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  contrastive_opt:
    type: ContrastiveLoss
    loss_weight: 0.1

# validation settings
val:
  val_freq: 2500
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2.5e3
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: local
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
