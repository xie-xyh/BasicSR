# DEA-Net Dense 子集单独训练配置
# 数据：datasets/OWH/Dense/{train,test}（setup_owh.py 生成）
# 注意：Dense 为极浓雾（平均透射率 t≈0.2），PSNR 存在 ~30dB 量级的噪声放大上限，
#       指标须结合该语境解读，勿与 SOTS 等轻雾数据集直接比较
# PYTHONPATH="./:${PYTHONPATH}" CUDA_VISIBLE_DEVICES=0 python basicsr/train.py -opt options/train/DEANet/train_DEANet_dense.yml

# general settings
name: 101_DEANet_OWH-Dense_50k_B16G1
model_type: DehazeModel
scale: 1
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: OWH-Dense
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/train/clear
    dataroot_lq: datasets/OWH/Dense/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 6
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk

# network structures
network_g:
  type: DEANet
  base_dim: 32

# path
path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 50000  # 8142 张 x bs16 ≈ 509 iter/epoch，50k ≈ 100 epoch
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  contrastive_opt:
    type: ContrastiveLoss
    loss_weight: 0.1

# validation settings
val:
  val_freq: 2500
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2.5e3
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: local
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
