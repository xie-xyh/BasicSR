# 004b：DEANetV3（MDTA 通道自注意力块）——非频域的"内容自适应全局操作"对照组
# 与 004a 互为对照：两者同为内容自适应全局模块，004a 走频域低频路径，004b 走空域通道注意力，
# 用于分离"内容自适应"与"低频限定"两个因素的贡献。
# 冒烟实测（2026-11-11）：512px 单卡 bs16 峰值 42.5 GiB；bs20 OOM → 取 bs16（与 003d 同偏差，记录在案）
# 启动（nohup 防断连）：CUDA_VISIBLE_DEVICES=<gpu> nohup python basicsr/train.py -opt <本文件> > experiments/004b_nohup.log 2>&1 &

# general settings
name: 004b_DEANetV3-MDTA_OWH-Mixed512_L1FFTGrad_60k_B16G1
model_type: DehazeModel
scale: 1  # 去雾是同等尺寸映射；PairedImageDataset 的成对裁剪依赖该字段
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: OWH-Mixed
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear      # 原始未过滤目录（用代码过滤替代 Mixed_ge512 软链接副本）
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 512
    filter_min_size: true  # 只保留宽高均 >= 512 的配对（实测 24381→20399，与 Mixed_ge512 一致）
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16  # 512px 实测峰值 42.5 GiB；bs20 OOM（注意力 C×C 中间张量）
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # 与前序实验相同：按子集分开监控
  val:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  val_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  val_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

# network structures
network_g:
  type: DEANetV3
  base_dim: 32
  global_block: mdta

# path
path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4  # 与 003c/003d 一致（bs16 vs 20 属已知小偏差，与 003d 同）
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [60000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 60000
  warmup_iter: -1  # no warm up

  # losses：与 003c 完全一致
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean

# validation settings
val:
  val_freq: 2000
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: online
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29515
