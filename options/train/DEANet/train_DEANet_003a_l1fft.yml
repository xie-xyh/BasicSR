# 003a 对照实验：DEA-Net + FFT 频域损失（唯一变量：loss）
# 与 001 严格对照：有效 batch 80（单卡 bs=80）、lr 2.5e-4、30k iter、Mixed 数据、EMA、seed 全一致
# 冒烟探测（2026-11-09）：bs=80 单卡峰值 46.8 GiB / 49 GB，1.14 s/iter，预计 ~9.5h
# 启动（GPU0，nohup 防断连）：
#   CUDA_VISIBLE_DEVICES=0 nohup python basicsr/train.py -opt options/train/DEANet/train_DEANet_003a_l1fft.yml \
#       > experiments/003a_nohup.log 2>&1 &

# general settings
name: 003a_DEANet_OWH-Mixed_L1FFT_30k_B80G1
model_type: DehazeModel
scale: 1  # 去雾是同等尺寸映射；PairedImageDataset 的成对裁剪依赖该字段
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: OWH-Mixed
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 80  # 单卡 bs=80 → 有效 batch 与 001（40x2）一致
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # 与 001 相同：按子集分开监控验证指标
  val:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  val_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  val_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

# network structures
network_g:
  type: DEANet
  base_dim: 32

# path
path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2.5e-4  # 与 001 一致（有效 batch 相同，无需重缩放）
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [30000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 30000  # 与 001 一致
  warmup_iter: -1  # no warm up

  # losses：L1 + FFT 频域损失（对照 001 的纯 L1）
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 0.5  # 原始量级 ~0.03（l_pix ~0.16 的 1/5），0.5 使其占比 ~9%
    reduction: mean

# validation settings
val:
  val_freq: 1000
  save_img: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: online
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29510
