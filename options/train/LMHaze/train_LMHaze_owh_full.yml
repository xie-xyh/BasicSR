# LMHaze (MoE-Mamba) OWH 全量混合训练
# 启动：bash scripts/train_lmhaze_owh.sh 2
# 续训：bash scripts/train_lmhaze_owh.sh 2 --auto_resume

name: 011a_LMHaze_OWH-Mixed_L1_150k_B1G2
model_type: LMHazeModel
scale: 1
num_gpu: 2
manual_seed: 100
# MoE 每个 step 只激活部分专家，DDP 必须检测未使用参数
find_unused_parameters: true

datasets:
  train:
    name: OWH-Mixed-full
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 1  # 256 patch 在 48 GiB RTX 4090 上验证；每卡 2 会 OOM
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  val_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  val_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

network_g:
  type: LMHaze
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  mlp_ratio: 2
  bias: false
  dual_pixel_task: false
  num_experts: 14
  expert_groups: [[0, 5, 3], [5, 8, 2], [8, 11, 1], [11, 14, 1]]
  use_internal_router: true
  router_dim: 64

path:
  pretrain_network_g: ~
  param_key_g: params
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  total_iter: 150000
  warmup_iter: -1
  grad_clip_norm: 0.01
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [30000, 120000]
    restart_weights: [1, 1]
    eta_mins: [!!float 2e-4, !!float 1e-6]
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 5000
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: online
    resume_id: ~

dist_params:
  backend: nccl
  port: 29511
