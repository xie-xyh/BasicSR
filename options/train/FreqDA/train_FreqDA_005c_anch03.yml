# 005c：anchor 折中 0.3（005b anchor 0.1 色偏回潮）；——004a 骨架冻结 + 频率解耦低秩适配器，域内真实雾池自监督训练
# 设计文档：research/005_sim2real/README.md §7
# loss 权重为首猜值（l_dcp 原始 ~0.5、l_disp 原始 ~0.06、l_tv 由零起步），开训后按 log 占比再调
# 启动：CUDA_VISIBLE_DEVICES=<gpu> nohup python basicsr/train.py -opt <本文件> > experiments/005c_nohup.log 2>&1 &

# general settings
name: 005c_FreqDA_OWH-RealPoolA_lr1e3-anch03_5k_B16G1
model_type: FreqDAModel
scale: 1
num_gpu: 1
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: OWH-RealPoolA-train
    type: RealHazyDataset
    dataroot_lq: datasets/OWH-RealPoolA/train   # 1858 张域内真实雾图（已去重/过滤）
    io_backend:
      type: disk
    crop_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # 域内验证集（400 张，训练从未见过）：FADE/NIQE 监控适配效果
  # （防遗忘检查放在训练结束后一次性评估：Dense-test PSNR 对比 004a 基线 24.86；
  #   框架对所有 val 数据集共用 metrics 段，无 GT 数据集不能配 psnr，故不混挂）
  val:
    name: OWH-RealPoolA-val
    type: SingleImageDataset
    dataroot_lq: datasets/OWH-RealPoolA/val
    io_backend:
      type: disk

# network structures
network_g:
  type: FreqDA
  backbone_ckpt: experiments/004a_DEANetV3-LFM_OWH-Mixed512_L1FFTGrad_60k_B20G1/models/net_g_60000.pth
  cutoff: 0.08
  rank_l: 16
  rank_h: 4
  mod_size: 16

# path（骨架由 arch 内部加载；此处不需要 pretrain）
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-3
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [5000]
    restart_weights: [1]
    eta_min: !!float 1e-6

  total_iter: 5000
  warmup_iter: -1

  # 自监督物理先验（无 GT）
  dcp_opt:
    type: DarkChannelLoss
    loss_weight: 0.05   # 005a 首跑教训：0.1 无下界版本把输出压成青色调并骗过 FADE；改 hinge 版 + 降权
    patch: 7
    floor: 0.1          # 暗通道低于 0.1 后不再施压（防过暗）
  dispersion_opt:
    type: DispersionFloorLoss
    loss_weight: 1.0    # 原始值 ~0.06 → 贡献 ~0.06
    tau: 0.08
  tv_opt:
    type: TVLoss
    loss_weight: 0.2    # 作用于 R_H 输出（初始为 0）
  color_anchor_opt:
    type: ColorAnchorLoss
    loss_weight: 0.3    # 005c：0.1 偏色回潮（005b 目检），取 0.1~1.0 中间值

# validation settings
val:
  val_freq: 1000
  save_img: true
  pbar: true

  metrics:
    fade:
      type: calculate_fade
      better: lower
    niqe:
      type: calculate_niqe
      better: lower

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: online
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29516
