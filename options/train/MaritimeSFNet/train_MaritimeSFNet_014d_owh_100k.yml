# MaritimeSFNet (014d) 正式 100k 合成海雾主干训练配置（OWH v2 协议，面向 015 真实海雾 LoRA 基座）
# 启动（hust GPU1）：
#   CUDA_VISIBLE_DEVICES=1 OMP_NUM_THREADS=1 python -u basicsr/train.py -opt options/train/MaritimeSFNet/train_MaritimeSFNet_014d_owh_100k.yml
# 断点续训：
#   CUDA_VISIBLE_DEVICES=1 OMP_NUM_THREADS=1 python -u basicsr/train.py -opt options/train/MaritimeSFNet/train_MaritimeSFNet_014d_owh_100k.yml --auto_resume

name: 014d_MaritimeSFNet_OWHscreened_100k_B16G1
model_type: MaritimeSFModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: OWH-Mixed
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 512
    filter_min_size: true
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: null
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/train_manifest.txt
  val:
    name: OWH-Dense-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_manifest.txt
  val_2:
    name: OWH-Mist-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_2_manifest.txt
  val_3:
    name: OWH-Moderate-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_3_manifest.txt

network_g:
  type: MaritimeSFNet
  widths: [36, 72, 144]
  depths: [3, 3, 8]
  use_reparam: true
  use_cd: true
  channel_spatial_attn: true
  use_aniso_lk: true
  lfm_cutoff_img: 0.025
  lfm_edge_img: 0.01
  lfm_mod_grids: [8, 16]
  lk_strip: 31
  lk_square: 15
  fcsf_scene_context: true
  fcsf_alpha_bias: -1.2
  basr_symmetric: true
  basr_scene_gate: true
  basr_g_max: 4.0
  use_l2_aniso_lk: true
  l2_lk_strip: 15
  l2_lk_square: 7
  use_mimo_input: true
  use_deep_supervision: false
  activation_checkpointing: l1_l2  # 仅对 1x 与 1/2 尺度重计算：hust 4090 GPU1 实测 32.3 GiB / 1.57 s/it

path:
  pretrain_network_g: null
  param_key_g: params
  strict_load_g: true
  resume_state: null

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  total_iter: 100000
  warmup_iter: 500
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean

val:
  val_freq: 4000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher

logger:
  print_freq: 100
  save_checkpoint_freq: 4000
  use_tb_logger: true
  use_swanlab: true
  swanlab:
    project: dehaze
    mode: online
    resume_id: null

dist_params:
  backend: nccl
  port: 29548
