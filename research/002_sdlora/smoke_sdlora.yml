# 002_SDLoRA 冒烟测试配置：7 对训练 + 4 对验证，20 iter 全流程验证
# 用法：CUDA_VISIBLE_DEVICES=0 python basicsr/train.py -opt research/002_sdlora/smoke_sdlora.yml --debug
name: smoke_SDLoRA
model_type: SDLoRAModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: smoke-train
    type: PairedImageDataset
    dataroot_gt: /tmp/sdlora_smoke/train/GT
    dataroot_lq: /tmp/sdlora_smoke/train/LQ
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: false
    num_worker_per_gpu: 0
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: smoke-val
    type: PairedImageDataset
    dataroot_gt: /tmp/sdlora_smoke/val/GT
    dataroot_lq: /tmp/sdlora_smoke/val/LQ
    io_backend:
      type: disk

network_g:
  type: SDLoRADehaze
  sd_path: experiments/pretrained_models/sd21base
  lora_rank: 8
  lora_targets: [to_q, to_k, to_v, to_out.0]
  fixed_timestep: 999
  vae_fp32: false
  gradient_checkpointing: true

path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: false
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.999]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [20]
    restart_weights: [1]
    eta_min: !!float 1e-6
  total_iter: 20
  warmup_iter: 5
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  perceptual_opt:
    type: PerceptualLoss
    layer_weights: {conv1_2: 0.1, conv2_2: 0.1, conv3_4: 1, conv4_4: 1, conv5_4: 1}
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: 2.0
    style_weight: 0
    criterion: l1

val:
  val_freq: 10
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 2
  save_checkpoint_freq: 10
  use_tb_logger: false
  use_swanlab: false

dist_params:
  backend: nccl
  port: 29509
