# 011b 冒烟配置：合成数据 6 iter 全链路验证（dataset→model→loss→save→validation）
# 数据复用 research/006_hihaze/smoke（随机合成配对小图）
name: smoke_011b_wavelet
model_type: WaveletUNetModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: smoke-train
    type: PairedImageDataset
    dataroot_gt: research/006_hihaze/smoke/train/GT
    dataroot_lq: research/006_hihaze/smoke/train/LQ
    io_backend:
      type: disk
    gt_size: 64
    use_hflip: false
    use_rot: false
    num_worker_per_gpu: 0
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: smoke-val
    type: PairedImageDataset
    dataroot_gt: research/006_hihaze/smoke/val/GT
    dataroot_lq: research/006_hihaze/smoke/val/LQ
    io_backend:
      type: disk

network_g:
  type: WaveletUNet
  widths: [32, 64, 128, 256]
  feat: 32

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [100000]
    gamma: 0.5
  total_iter: 6
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean
  subband_opt:
    loss_weight: 1.0
    w_base: 1.0
    w_detail: 1.0

val:
  val_freq: 3
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher

logger:
  print_freq: 1
  save_checkpoint_freq: 3
  use_tb_logger: false

dist_params:
  backend: nccl
  port: 29529
