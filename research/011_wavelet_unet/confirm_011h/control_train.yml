name: 011h_control_WaveletUNet_OWHscreened_60k_B20G1
model_type: WaveletUNetModel
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: OWH-Mixed
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 512
    filter_min_size: true
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 20
    dataset_enlarge_ratio: 1
    prefetch_mode: null
    meta_info_file: research/011_wavelet_unet/confirm_011h/train_manifest.txt
  val:
    name: OWH-Dense-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/confirm_011h/val_manifest.txt
  val_2:
    name: OWH-Mist-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/confirm_011h/val_2_manifest.txt
  val_3:
    name: OWH-Moderate-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/confirm_011h/val_3_manifest.txt
network_g:
  type: WaveletUNet
  widths:
  - 32
  - 64
  - 128
  - 256
  feat: 32
  use_lfm: true
  detail_stem: false
path:
  pretrain_network_g: null
  param_key_g: params
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 60000
    restart_weights:
    - 1
    eta_min: 1.0e-06
  total_iter: 60000
  warmup_iter: 500
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean
  subband_opt:
    loss_weight: 1.0
    w_base: 1.0
    w_detail: 1.0
val:
  val_freq: 4000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher
logger:
  print_freq: 100
  save_checkpoint_freq: 4000
  use_tb_logger: true
  use_swanlab: false
  swanlab:
    project: dehaze
    mode: online
    resume_id: null
dist_params:
  backend: nccl
  port: 29530
