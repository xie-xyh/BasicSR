name: 011h_hust_local_20261119_control_WaveletUNet_OWHscreened_60k_B20G1
model_type: WaveletUNetModel
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  val:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  val_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  val_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk
network_g:
  type: WaveletUNet
  widths:
  - 32
  - 64
  - 128
  - 256
  feat: 32
  use_lfm: true
  detail_stem: false
path:
  pretrain_network_g: null
  param_key_g: params
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 60000
    restart_weights:
    - 1
    eta_min: 1.0e-06
  total_iter: 60000
  warmup_iter: 500
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean
  subband_opt:
    loss_weight: 1.0
    w_base: 1.0
    w_detail: 1.0
val:
  val_freq: 4000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher
logger:
  print_freq: 100
  save_checkpoint_freq: 4000
  use_tb_logger: true
  use_swanlab: false
  swanlab:
    project: dehaze
    mode: online
    resume_id: null
dist_params:
  backend: nccl
  port: 29530
