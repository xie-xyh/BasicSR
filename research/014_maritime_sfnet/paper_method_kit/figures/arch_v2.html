<style>

  html, body {

</head>
<body>

    .skip-teal { fill: none; stroke: #2F6B60; stroke-width: 1.25; marker-end: url(#arr-teal); }

    .dim-txt { font-family: 'Times New Roman', Georgia, serif; font-style: italic; font-size: 10px; fill: #475569; }
    .op-circ { fill: #FFFFFF; stroke: #24292F; stroke-width: 1.25; }
    .op-sym { font-size: 11.5px; font-weight: 700; fill: #24292F; text-anchor: middle; dominant-baseline: central; }
    .lora-dot { fill: #A95035; stroke: #FFFFFF; stroke-width: 0.9; }
    .lora-txt { font-size: 7.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .legend-txt { font-size: 9.3px; fill: #334155; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="1480" height="890" fill="#FFFFFF"/>

  <!-- ===================================================================== -->
  <!-- PANEL (a): STRICT LEFT-TO-RIGHT 3-SCALE SYMMETRIC U-NET BACKBONE      -->
  <!-- ===================================================================== -->
  <rect x="14" y="12" width="1452" height="450" rx="6" class="panel-bg"/>
  <text x="28" y="34" class="panel-title">
    (a) Overall Three-Scale MaritimeSFNet Backbone (Max Stride <tspan class="math" font-size="13">s</tspan> = 4, Scale-Bandwidth Aligned)
  </text>

  <!-- Horizontal Scale Tier Bands -->
  <rect x="24" y="66" width="1432" height="98" rx="4" class="stage-band"/>
  <rect x="24" y="182" width="1432" height="98" rx="4" class="stage-band"/>
  <rect x="24" y="298" width="1432" height="122" rx="4" class="stage-band"/>

  <!-- Far-left Scale Annotations -->
  <text x="32" y="84" class="scale-tag">Scale 1 (1×)</text>
  <text x="32" y="98" class="dim-txt">H × W, C<tspan font-style="normal" font-size="7.5" dy="2">1</tspan><tspan dy="-2"> = 36</tspan></text>
  <text x="32" y="200" class="scale-tag">Scale 2 (1/2)</text>
  <text x="32" y="214" class="dim-txt">H/2 × W/2, C<tspan font-style="normal" font-size="7.5" dy="2">2</tspan><tspan dy="-2"> = 72</tspan></text>
  <text x="32" y="316" class="scale-tag">Scale 3 (1/4)</text>
  <text x="32" y="330" class="dim-txt">H/4 × W/4, C<tspan font-style="normal" font-size="7.5" dy="2">3</tspan><tspan dy="-2"> = 144</tspan></text>

  <!-- Input Hazy Maritime Image Thumbnail -->
  <g transform="translate(106, 86)">
    <rect x="0" y="0" width="56" height="48" rx="3" fill="url(#hazy-sea)" stroke="#3B5978" stroke-width="1.3"/>
    <line x1="2" y1="26" x2="54" y2="26" stroke="#9AA9B6" stroke-width="0.9"/>
    <path d="M 15 26 L 19 21 L 37 21 L 41 26 Z" fill="#8B9AA8"/>
    <rect x="25" y="17" width="6" height="4" fill="#9AA9B6"/>
    <text x="28" y="61" class="blk-sub">Hazy <tspan class="math" font-size="10.5">I</tspan> (3×<tspan class="math" font-size="9.5">H</tspan>×<tspan class="math" font-size="9.5">W</tspan>)</text>
  </g>

  <!-- Top Raw Radiance Skip I -> C2-BASR -->
  <path d="M 134 86 L 134 52 Q 134 46 140 46 L 1326 46 Q 1332 46 1332 52 L 1332 86" class="skip-terra"/>
  <rect x="615" y="37" width="232" height="17" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>

  </text>

  <rect x="194" y="342" width="64" height="32" rx="4" class="blk-ochre"/>
  <text x="226" y="356" class="blk-small" fill="#4F3A14">MIMO ↓4×</text>
  <text x="226" y="368" class="blk-sub" fill="#6E5220">Conv 3×3<tspan font-size="7" dy="2">0</tspan></text>

  <text x="338" y="241" class="blk-sub">Rep5-CD Block</text>

  <rect x="256" y="276" width="84" height="20" rx="3" class="blk-slate-deep"/>

  </text>

  <text x="624" y="367" class="blk-sub" fill="#23574E">LFM + LK</text>
  <circle cx="660" cy="340" r="6" class="lora-dot"/>
  <text x="660" y="340" class="lora-txt">L</text>

  <path d="M 666 358 L 678 358" class="flow"/>
  <rect x="680" y="336" width="76" height="44" rx="4" class="blk-teal-soft"/>

  <text x="718" y="368" class="blk-sub">Rep5+DCA</text>

  <path d="M 756 358 L 768 358" class="flow"/>

  <!-- STRICT LEFT-TO-RIGHT UP2: FCSF3 (848) -> Up2 -> FCSF2 (884..964) -->

  <text x="924" y="289" class="blk-sub" font-weight="600">Up2 (Bilin×2 + 3×3)</text>

  <!-- Skip2: Enc2 -> FCSF2 -->
  <path d="M 386 231 L 882 231" class="skip-ochre"/>
  <text x="634" y="224" class="blk-sub" fill="#7D5B22" font-weight="600">

  </text>

  <!-- DECODER L2: FCSF2 -> Dec2 -> L2-AnisoLK (Strictly Left-to-Right!) -->
  <rect x="884" y="209" width="80" height="44" rx="4" class="blk-ochre"/>
  <text x="924" y="227" class="blk-title" fill="#4F3A14">FCSF2</text>
  <text x="924" y="241" class="blk-sub" fill="#6E5220">Scene Skip</text>
  <circle cx="958" cy="215" r="6" class="lora-dot"/>
  <text x="958" y="215" class="lora-txt">L</text>

  <path d="M 964 231 L 978 231" class="flow"/>
  <rect x="984" y="205" width="84" height="44" rx="4" class="blk-slate" opacity="0.5"/>
  <rect x="980" y="209" width="84" height="44" rx="4" class="blk-slate"/>
  <text x="1022" y="227" class="blk-title">Dec2 (×3)</text>
  <text x="1022" y="241" class="blk-sub">Rep5-CD</text>

  <path d="M 1064 231 L 1078 231" class="flow"/>
  <rect x="1080" y="209" width="88" height="44" rx="4" class="blk-teal"/>
  <text x="1124" y="227" class="blk-title" fill="#174038">L2-AnisoLK</text>
  <text x="1124" y="241" class="blk-sub" fill="#23574E">1×15 / 15×1 / 7</text>
  <circle cx="1162" cy="215" r="6" class="lora-dot"/>
  <text x="1162" y="215" class="lora-txt">L</text>

  <!-- STRICT LEFT-TO-RIGHT UP1: L2-AnisoLK (1168) -> Up1 -> FCSF1 (1140..1220) -->
  <!-- Place FCSF1 at x=1122..1202? Better: L2-AnisoLK ends at 1168, Up1 rises right from 1124? No, route from right edge 1168 -> x=1186 -> UP straight into FCSF1 bottom (x=1146..1226, center 1186)!! -->
  <!-- Wait: check remaining room right of FCSF1 (1226): Dec1 (1240..1316), C2-BASR (1330..1410? No, need output thumbnail too!) -->
  <!-- Let's make exact tight fit: shift FCSF2(842..916) -> Dec2(930..1004) -> L2-AnisoLK(1018..1100), then Up1 rises straight at x=1132 into FCSF1(1094..1170) -> Dec1(1184..1262) -> C2-BASR(1276..1376) -> Output J(1392..1448)!! -->
  <!-- WAIT: Let's verify in v2! Right now FCSF2 is at 884..964; let's check x-room if we put FCSF1 at 1124..1198? Wait: 1124 is straight above L2-AnisoLK (1080..1168, center 1124)!! -->
  <!-- GENIUS!! Putting FCSF1 centered at x=1124 (directly above L2-AnisoLK center 1124) gives a STRAIGHT VERTICAL UPWARD ARROW `Up1` with ZERO horizontal jog AND leaves x=1168..1450 (282px) for Dec1 + C²-BASR + Restored J!! Let's verify exact px:
       FCSF1: 1084..1164 (center 1124, width 80)
       arrow: 1164 -> 1178
       Dec1 (x3): 1180..1258 (width 78)
       arrow: 1258 -> 1274
       C2-BASR: 1276..1374 (width 98, center 1325 -> align top skip I drop to x=1325!)
       arrow: 1374 -> 1388
       Restored J: 1390..1446 (width 56, fits inside 1466 with 20px right margin!!)
       100% STRICTLY MONOTONIC LEFT-TO-RIGHT + STRAIGHT VERTICAL UP1!! -->

  <path d="M 1124 209 L 1124 136" class="flow"/>
  <rect x="1074" y="158" width="100" height="20" rx="3" class="blk-slate-deep"/>
  <text x="1124" y="171" class="blk-sub" font-weight="600">Up1 (Bilin×2 + 3×3)</text>

  <!-- Skip1: Enc1 -> FCSF1 (High-pass only!) -->
  <path d="M 350 112 L 1082 112" class="skip-ochre"/>
  <text x="716" y="105" class="blk-sub" fill="#7D5B22" font-weight="600">
    1× Skip (<tspan class="math" fill="#7D5B22" font-size="10">s</tspan><tspan font-size="7" dy="2" fill="#7D5B22">1</tspan><tspan dy="-2">): Strict High-Pass Only (α ≡ 0, Blocks Shallow Haze Passthrough)</tspan>
  </text>

  <!-- DECODER L1: FCSF1 -> Dec1 -> C2-BASR -> Output -->
  <rect x="1084" y="90" width="80" height="44" rx="4" class="blk-ochre"/>
  <text x="1124" y="108" class="blk-title" fill="#4F3A14">FCSF1</text>
  <text x="1124" y="122" class="blk-sub" fill="#6E5220">α ≡ 0, HP β</text>
  <circle cx="1158" cy="96" r="6" class="lora-dot"/>
  <text x="1158" y="96" class="lora-txt">L</text>

  <path d="M 1164 112 L 1178 112" class="flow"/>
  <rect x="1184" y="86" width="80" height="44" rx="4" class="blk-slate" opacity="0.5"/>
  <rect x="1180" y="90" width="80" height="44" rx="4" class="blk-slate"/>
  <text x="1220" y="108" class="blk-title">Dec1 (×3)</text>
  <text x="1220" y="122" class="blk-sub">Rep5-CD</text>

  <path d="M 1260 112 L 1276 112" class="flow"/>
  <rect x="1278" y="88" width="98" height="48" rx="4" class="blk-terra"/>
  <text x="1327" y="107" class="blk-title" fill="#542416">C²-BASR Head</text>
  <text x="1327" y="123" class="math" font-size="10.2" fill="#783520" text-anchor="middle">
    G<tspan class="math-rm" font-size="7.2" dy="2" fill="#783520">sym</tspan><tspan dy="-2">(K̃)⊙I + B</tspan>
  </text>
  <circle cx="1370" cy="94" r="6" class="lora-dot"/>
  <text x="1370" y="94" class="lora-txt">L</text>

  <path d="M 1376 112 L 1390 112" class="flow"/>
  <!-- Output Restored Maritime Image -->
  <g transform="translate(1392, 86)">
    <rect x="0" y="0" width="56" height="48" rx="3" fill="url(#clear-sea)" stroke="#2F6B60" stroke-width="1.3"/>
    <line x1="2" y1="26" x2="54" y2="26" stroke="#E2EEF5" stroke-width="1.0"/>
    <path d="M 15 26 L 19 20.5 L 37 20.5 L 41 26 Z" fill="#1E293B"/>
    <rect x="25" y="16.5" width="6" height="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="0.6"/>
    <text x="28" y="61" class="blk-sub">Restored <tspan class="math" font-size="10.5">Ĵ</tspan></text>
  </g>

  <!-- Legend Strip inside Panel (a) -->
  <g transform="translate(28, 434)">
    <rect x="0" y="0" width="13" height="9.5" rx="2" class="blk-slate"/>
    <text x="19" y="8.2" class="legend-txt">Local Texture &amp; Rep5-CD (Folded &amp; Frozen in LoRA)</text>

  <!-- Local DW Gate + Global SceneGate -->
  <path d="M 1158 556 L 1178 556" class="flow"/>
  <path d="M 1158 600 L 1178 600" class="flow"/>

  <rect x="1180" y="540" width="100" height="32" rx="4" class="blk-ochre"/>
  <text x="1230" y="554" class="blk-small" fill="#4F3A14">Local DW Gate</text>
  <text x="1230" y="566" class="blk-sub" fill="#6E5220">1×1→DW3→1×1</text>
  <circle cx="1275" cy="545" r="5" class="lora-dot"/>
  <text x="1275" y="545" class="lora-txt">L</text>

  <rect x="1180" y="582" width="100" height="32" rx="4" class="blk-ochre"/>
  <text x="1230" y="596" class="blk-small" fill="#4F3A14">SceneGate<tspan font-size="6.8" dy="1.8">0</tspan></text>
  <text x="1230" y="608" class="blk-sub" fill="#6E5220">GAP → MLP</text>
  <circle cx="1275" cy="587" r="5" class="lora-dot"/>
  <text x="1275" y="587" class="lora-txt">L</text>

  <!-- Sum logits -> sigmoid -> (alpha, beta) -->
  <path d="M 1280 556 L 1300 556 L 1300 568" class="flow"/>
  <path d="M 1280 598 L 1300 598 L 1300 586" class="flow"/>
  <circle cx="1300" cy="577" r="7.5" class="op-circ"/>
  <text x="1300" y="577" class="op-sym">+</text>

  <path d="M 1307.5 577 L 1320 577" class="flow"/>
  <rect x="1322" y="558" width="106" height="38" rx="4" class="blk-ochre"/>
  <text x="1375" y="574" class="blk-small" fill="#4F3A14">σ(·) → (<tspan class="math" font-size="10" fill="#4F3A14">α</tspan>, <tspan class="math" font-size="10" fill="#4F3A14">β</tspan>)</text>
  <text x="1375" y="588" class="blk-sub" fill="#6E5220">
    <tspan class="math" font-size="9.2" fill="#6E5220">α</tspan><tspan font-size="6.5" dy="1.5" fill="#6E5220">0</tspan><tspan dy="-1.5">≈0.23 | 1×: </tspan><tspan class="math" font-size="9.2" fill="#6E5220">α</tspan>≡0
  </text>

  <!-- Final Fusion Block -->
  <path d="M 1354 596 L 1354 614" class="flow"/>
  <rect x="1290" y="616" width="154" height="38" rx="4" class="blk-neutral"/>
  <text x="1367" y="632" class="math" font-size="9.8" text-anchor="middle">
    F<tspan class="math-rm" font-size="6.8" dy="2">dec</tspan><tspan dy="-2"> + αΔL + βF</tspan><tspan class="math-rm" font-size="6.8" dy="2">enc</tspan><tspan class="math-rm" font-size="6.8" dy="-4">H</tspan>
  </text>
  <text x="1367" y="647" class="blk-sub">→ Conv 1×1 Projection</text>
  <circle cx="1439" cy="621" r="5" class="lora-dot"/>
  <text x="1439" y="621" class="lora-txt">L</text>

  <text x="1144" y="668" class="blk-sub" fill="#6E5220">
    Convex low-band (1−<tspan class="math" fill="#6E5220">α</tspan>)<tspan class="math" fill="#6E5220">F</tspan><tspan font-size="6.8" dy="1.5" fill="#6E5220">dec</tspan><tspan font-size="6.8" dy="-3.5" fill="#6E5220">L</tspan><tspan dy="2"> + </tspan><tspan class="math" fill="#6E5220">αF</tspan><tspan font-size="6.8" dy="1.5" fill="#6E5220">enc</tspan><tspan font-size="6.8" dy="-3.5" fill="#6E5220">L</tspan><tspan dy="2"> blocks haze veil leakage</tspan>
  </text>

  <!-- Bottom Card: C2 Zero-Curvature BASR -->
  <rect x="996" y="688" width="460" height="176" rx="5" class="inner-card"/>
  <text x="1226" y="705" class="card-title" fill="#8B3F28">C² Zero-Curvature BASR Head + Scene Contrast Gate</text>

  <!-- Inputs d1 and I -->
  <rect x="1006" y="720" width="40" height="26" rx="3.5" class="blk-slate"/>
  <text x="1026" y="737" class="math" font-size="11" text-anchor="middle">
    d<tspan class="math-rm" font-size="7.5" dy="2.5">1</tspan>
  </text>

  <rect x="1006" y="806" width="40" height="26" rx="3.5" class="blk-terra"/>
  <text x="1026" y="823" class="math" font-size="11" text-anchor="middle">I</text>

  <!-- Conv3x3_0 -> (K~, B) -->
  <path d="M 1046 733 L 1068 733" class="flow"/>
  <rect x="1070" y="717" width="84" height="32" rx="4" class="blk-terra"/>
  <text x="1112" y="731" class="blk-small" fill="#542416">Conv 3×3<tspan font-size="6.8" dy="1.8">0</tspan></text>
  <text x="1112" y="744" class="math" font-size="9.8" fill="#783520" text-anchor="middle">→ (K̃, B)</text>
  <circle cx="1149" cy="722" r="5" class="lora-dot"/>
  <text x="1149" y="722" class="lora-txt">L</text>

  <!-- Scene Contrast MLP (wide enough for crisp zero overflow!) -->
  <path d="M 1057 733 L 1057 772 L 1068 772" class="flow"/>
  <path d="M 1046 819 L 1057 819 L 1057 780 L 1068 780" class="flow"/>
  <rect x="1070" y="758" width="136" height="38" rx="4" class="blk-ochre"/>
  <text x="1138" y="773" class="blk-small" fill="#4F3A14">Scene Contrast MLP<tspan font-size="6.8" dy="1.8">0</tspan></text>
  <text x="1138" y="787" class="blk-sub" fill="#6E5220">
    [GAP(<tspan class="math" fill="#6E5220">d</tspan><tspan font-size="6.5" dy="1.5" fill="#6E5220">1</tspan><tspan dy="-1.5">), GAP(</tspan><tspan class="math" fill="#6E5220">I</tspan>), <tspan class="math" fill="#6E5220">σ</tspan><tspan font-size="6.5" dy="1.5" fill="#6E5220">RMS</tspan><tspan dy="-1.5">(</tspan><tspan class="math" fill="#6E5220">I</tspan>)]
  </text>
  <circle cx="2000" cy="0" r="0"/>
  <circle cx="2000" cy="0" r="0"/>
  <circle cx="1201" cy="763" r="5" class="lora-dot"/>
  <text x="1201" y="763" class="lora-txt">L</text>

  <!-- Clean split: K~ * s_k -> G_sym, and B * s_b -> + -->
  <path d="M 1154 733 L 1212 733" class="flow"/>
  <path d="M 1206 777 L 1222 777 L 1222 743" class="flow"/>
  <text x="1238" y="771" class="math" font-size="9.5" fill="#4F3A14">2σ→(s<tspan class="math-rm" font-size="6.8" dy="1.8">k</tspan><tspan dy="-1.8">, s</tspan><tspan class="math-rm" font-size="6.8" dy="1.8">b</tspan><tspan dy="-1.8">)</tspan></text>

  <circle cx="1222" cy="733" r="8" class="op-circ"/>
  <text x="1222" y="733" class="op-sym">×</text>

  <!-- Top bias branch B·s_b cleanly routed above G_sym to final + -->
  <path d="M 1222 725 L 1222 713 L 1418 713 L 1418 809" class="flow"/>
  <text x="1320" y="710" class="math" font-size="9.8" fill="#542416" text-anchor="middle">
    Modulated Additive Bias <tspan class="math" fill="#542416">B</tspan>·<tspan class="math" fill="#542416">s</tspan><tspan class="math-rm" font-size="6.8" dy="1.8" fill="#542416">b</tspan>
  </text>

  <!-- G_sym piecewise tanh block -->
  <path d="M 1230 733 L 1252 733" class="flow"/>
  <rect x="1254" y="718" width="116" height="46" rx="4" class="blk-terra"/>
  <text x="1312" y="733" class="blk-small" fill="#542416">
    <tspan class="math" font-size="10" fill="#542416">G</tspan><tspan font-size="6.8" dy="1.8" fill="#542416">sym</tspan><tspan dy="-1.8">(</tspan><tspan class="math" fill="#542416">k</tspan>) ∈ (0.5, 4.0)
  </text>
  <text x="1312" y="746" class="math" font-size="9.5" fill="#783520" text-anchor="middle">
    1 + a<tspan class="math-rm" font-size="7" dy="1.8">±</tspan><tspan dy="-1.8"> tanh(k / a</tspan><tspan class="math-rm" font-size="7" dy="1.8">±</tspan><tspan dy="-1.8">)</tspan>
  </text>
  <text x="1312" y="759" class="blk-sub" fill="#2F6B60" font-weight="600">G(0)=1, G'(0)=1, G''(0)=0</text>

  <!-- Final affine J_hat = G * I + B -->
  <path d="M 1046 819 L 1372 819" class="skip-terra"/>
  <path d="M 1370 741 L 1382 741 L 1382 809" class="flow"/>
  <circle cx="1382" cy="819" r="8" class="op-circ"/>
  <text x="1382" y="819" class="op-sym">×</text>

  <path d="M 1390 819 L 1408 819" class="flow"/>
  <circle cx="1418" cy="819" r="8" class="op-circ"/>
  <text x="1418" y="819" class="op-sym">+</text>

  <path d="M 1426 819 L 1448 819" class="flow"/>
  <text x="1414" y="844" class="math" font-size="10.8" text-anchor="middle">Ĵ = G⊙I + B</text>

  <text x="1190" y="852" class="blk-sub" fill="#783520">
    Zero curvature (<tspan class="math" fill="#783520">G</tspan>''(0)=0) eliminates Jensen overshoot &amp; 1/<tspan class="math" fill="#783520">t</tspan> blow-up
  </text>
