name: probe_014c_mimo_hust_v2_8000iter
model_type: MaritimeSFModel
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: OWH-Mixed
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 512
    filter_min_size: true
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: null
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/train_manifest.txt
  val:
    name: OWH-Dense-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_manifest.txt
  val_2:
    name: OWH-Mist-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_2_manifest.txt
  val_3:
    name: OWH-Moderate-internal-v2
    type: PairedImageDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/OWH/Mixed/train/clear
    dataroot_lq: datasets/OWH/Mixed/train/hazy
    meta_info_file: research/011_wavelet_unet/protocol_v2_20261118/confirm_011p_backbone_draft/val_3_manifest.txt
network_g:
  type: MaritimeSFNet
  widths:
  - 36
  - 72
  - 144
  depths:
  - 3
  - 3
  - 8
  use_reparam: true
  use_aniso_lk: true
  lfm_cutoff_img: 0.025
  lfm_edge_img: 0.01
  lfm_mod_grids:
  - 8
  - 16
  lk_strip: 31
  lk_square: 15
  use_mimo_input: true
  use_deep_supervision: true
  activation_checkpointing: false
path:
  experiments_root: experiments/probes
  pretrain_network_g: null
  param_key_g: params
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 60000
    restart_weights:
    - 1
    eta_min: 1.0e-06
  total_iter: 8000
  warmup_iter: 500
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 1.0
    reduction: mean
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.2
    reduction: mean
  deep_sup_opt:
    weights:
      '1/4': 0.1
      '1/2': 0.1
    fft_weight: 1.0
val:
  val_freq: 2000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      better: higher
logger:
  tb_logdir: tb_logger/probes
  print_freq: 100
  save_checkpoint_freq: 2000
  use_tb_logger: true
  use_swanlab: false
  swanlab:
    project: dehaze-probes
    mode: online
    resume_id: null
dist_params:
  backend: nccl
  port: 29545
