# 003a 最终评估：Dense 主测（与 results/001_dense_eval 同口径，可直连对比）
# 用法：python basicsr/test.py -opt research/003_deanet_global/test_003a_dense.yml
name: 003a_dense_eval
model_type: DehazeModel
scale: 1
num_gpu: 1

datasets:
  test_1:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  test_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  test_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

network_g:
  type: DEANet
  base_dim: 32

path:
  param_key_g: params_ema
  pretrain_network_g: experiments/003a_DEANet_OWH-Mixed_L1FFT_30k_B80G1/models/net_g_30000.pth
  strict_load_g: true

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
