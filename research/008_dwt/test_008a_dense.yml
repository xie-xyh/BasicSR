# 008a 终点评估（net_g_60000，params_ema，与 004a 全量评估同口径：三子集、test.py）
# 用法：CUDA_VISIBLE_DEVICES=<gpu> python basicsr/test.py -opt research/008_dwt/test_008a_dense.yml
name: 008a_dense_eval
model_type: DehazeModel
scale: 1
num_gpu: 1

datasets:
  test_1:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  test_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  test_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

network_g:
  type: DEANetV6
  base_dim: 32
  lfm_positions: [2, 5]
  mod_size: 16
  cutoff: 0.08

path:
  param_key_g: params_ema
  pretrain_network_g: experiments/008a_DEANetV6-DWT_OWH-Mixed512_L1FFTGrad_60k_B20G1/models/net_g_60000.pth
  strict_load_g: true

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
