# 004b 最终评估（Dense 最优 = 最终 checkpoint net_g_60000）：与 results/001_dense_eval 同口径全量评估
# 用法：CUDA_VISIBLE_DEVICES=1 python basicsr/test.py -opt research/004_lowfreq/test_004b_dense.yml
name: 004b_dense_eval
model_type: DehazeModel
scale: 1
num_gpu: 1

datasets:
  test_1:
    name: OWH-Dense-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Dense/test/clear
    dataroot_lq: datasets/OWH/Dense/test/hazy
    io_backend:
      type: disk
  test_2:
    name: OWH-Mist-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Mist/test/clear
    dataroot_lq: datasets/OWH/Mist/test/hazy
    io_backend:
      type: disk
  test_3:
    name: OWH-Moderate-test
    type: PairedImageDataset
    dataroot_gt: datasets/OWH/Moderate/test/clear
    dataroot_lq: datasets/OWH/Moderate/test/hazy
    io_backend:
      type: disk

network_g:
  type: DEANetV3
  base_dim: 32
  global_block: mdta

path:
  param_key_g: params_ema
  pretrain_network_g: experiments/004b_DEANetV3-MDTA_OWH-Mixed512_L1FFTGrad_60k_B16G1/models/net_g_60000.pth
  strict_load_g: true

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
